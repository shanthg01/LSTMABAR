# Human-style gold instructions (held-out test data). See README.md.
#
# source: simulated_human = written by independent LLM agents, each role-playing ONE
#   invented guitarist in an isolated context (10 people x 15 requests, 2026-10-09).
# source: human = written by real people. Append real items with ids continuing after
#   the last id, `author` set to a pseudonym (e.g. friend-01). Never relabel simulated items.
#
# Simulated authors:
#   sim-01: Kenji Morimoto, 44, Osaka jazz-fusion club player and J-pop session guitarist (Ibanez AS semi-hollow, Japanese Strat-type with SSS), fluent but non-native English, types short and polite, drops articles
#   sim-02: Jonas "Jo" Krüger, 28, Neukölln, plays a beat-up Harley Benton offset in post-punk band Kaltfront through whatever amp the venue has; lowercase typist, blunt, drops German words.
#   sim-03: Graham Pritchard, 55, Nuneaton; played rhythm in 80s pub band "The Rusty Nails", back at it with an Epiphone Les Paul copy and a Boss Katana in the spare room, polite, wary of tech, signs off his messages
#   sim-04: Darnell "Dee" Batiste, 34, New Orleans rhythm guitarist (Strat + ES-335, Deluxe Reverb) in a Frenchmen St brass band and Sunday church band, lives on tight clean chank and compression, types fast lowercase on his phone between sets
#   sim-05: Maya Tran, 21, DePaul junior in Chicago, plays a Player Tele (lots of two-hand tapping) in emo/math-rock band "glass hallway", lurks r/guitarpedals + TGP, watches every JHS/Knobs demo, overthinks everything, types lowercase w/ abbreviations
#   sim-06: Brendan "Bren" Kowalski, 36, Coburg (Melbourne) sparky, plays a '03 SG Standard in drop A/B through an Orange OR120 + Sunn Model T into two 4x12s for doom trio Mound of Ash; types lowercase, no apostrophes, dry and blunt.
#   sim-07: Rohan Kulkarni, 31, Andheri West home-studio session guitarist (HSS Strat, Ibanez RG, Focusrite into Reaper) tracking ad jingles and film BGM for Mumbai producers who send reference tracks and want files same night
#   sim-08: Darius "Kelz" Kelly, 26, Atlanta trap/hip-hop producer; records simple loops on a Squier Bullet Strat into a Scarlett Solo in FL Studio, thinks in mixing terms, types lowercase with abbreviations, doesn't know pedal names
#   sim-09: Dee Halvorsen, 34, Portland OR, sings and plays guitar in surf/garage trio The Tidepool Ghosts; plays a '66 Teisco Del Rey and a Guyatone LG-series through borrowed amps, owns a Maestro FZ-1A clone and a crusty Univox Super-Fuzz, types in lowercase and is dry and opinionated
#   sim-10: Johan Lindqvist, 33, Stockholm prog-metal 7-string player (Strandberg Boden, drop A / F#) and part-time engineer at a Södermalm studio, normally tracks DI + Neural DSP/Axe-FX sims and is testing this app against them; precise, frequency-minded, Swedish-English.

