# Gold target regions v1 (P4 task 4.5). One row per gold id; owner-reviewed.
# Read by `lstmabar data gold-targets` (validation) and `lstmabar data gold-pair` (rendering);
# module docs: src/lstmabar/data/gold.py. Not an instruction file: it is kept in targets/ so the
# vocab audit's glob over data/gold/*.yaml never sees it.
#
# How to review:
# - `tables` map the gold set's coarse levels to physical ranges on the free board
#   (compressor -> drive -> eq; units as in design §4.3). `pedals` map gain/brightness levels
#   to KB knob rotations in [0, 1]. A sample is drawn uniformly (in normalized knob space)
#   inside a region; knobs not listed stay at their block default or `tables.fixed`.
# - Each row's `target` is the tone the instruction asks for; each `distractor` contradicts
#   it on one `axis` and keeps everything else (rules in gold.py: gain -> clean or high-gain
#   drive, brightness -> the opposite extreme, mids -> scooped<->pushed, compression -> off).
#   EQ/compression-only requests list their own axes first. P5 renders the first two.
# - `ambiguous: true` + `ambiguity` flags rows whose region is a guess:
#     relative    = refers to an earlier setting ("less than before", "still too bright");
#                   the region is the gold label's absolute guess
#     vague       = no recoverable tone ("make it cooler", song/band reference only)
#     conflicting = asks for incompatible things (or the stated knob move contradicts the aim)
#   `in_scope: false` (copied from the gold label) = mainly needs effects we don't model.
#   P5 reports ambiguous / out-of-scope / unseen-pedal subsets separately.
# - `unseen_pedal: true` when the holdout pedal (rat) appears: P5 reports those separately.
# - `source` is copied from the gold file and never relabeled; sources are reported separately.
# - Edit `target`/`distractors`/flags freely; `lstmabar data gold-targets` re-validates (ids,
#   sources, unseen flags, and that each distractor's range on its axis is disjoint from the
#   target's). Set `status: reviewed` when done; gold-pair refuses a draft file.
version: 1
status: draft
tables:
  gain_db:            # Drive.gain_db (dB into the clipper, 0 dBFS = 1 V). KB derived ranges for
                      # reference: TS808 26-46, Fuzz Face 25-60, RAT 5-60, DS-1 40-60, Muff 38-60
    low: [14.0, 24.0]
    medium: [26.0, 36.0]
    high: [38.0, 48.0]
    extreme: [52.0, 60.0]
  boost_gain_db: [0.0, 10.0]   # family boost (gold: clean + gain low)
  family:             # free-board drive voicing (physical Drive knobs); clipping overrides the shaper
    boost: {pre_hpf_hz: [20.0, 60.0], softness: [0.0, 0.2], asymmetry: [0.0, 0.05], tone_db: [-1.0, 1.0]}
    overdrive: {pre_hpf_hz: [200.0, 500.0], softness: [0.1, 0.3], asymmetry: [0.0, 0.05], tone_db: [-6.0, -2.0]}
    distortion: {pre_hpf_hz: [150.0, 300.0], softness: [0.45, 0.7], asymmetry: [0.0, 0.05], tone_db: [-4.0, 0.0]}
    fuzz: {pre_hpf_hz: [30.0, 120.0], softness: [0.15, 0.35], asymmetry: [0.1, 0.3], tone_db: [-4.0, 0.0]}
  clipping:           # softness 0 = smooth tanh-like, 1 = near-hard; asymmetry adds even harmonics
    soft: {softness: [0.1, 0.3], asymmetry: [0.0, 0.05]}
    hard: {softness: [0.45, 0.7], asymmetry: [0.0, 0.05]}
    asymmetric: {softness: [0.15, 0.35], asymmetry: [0.2, 0.4]}
  brightness:         # EQ3 shelves: low 120 Hz, high 3 kHz (dB)
    dark: {high_db: [-12.0, -8.0], low_db: [0.0, 3.0]}
    slightly_dark: {high_db: [-7.0, -3.0], low_db: [0.0, 2.0]}
    neutral: {high_db: [-1.5, 1.5], low_db: [-1.5, 1.5]}
    slightly_bright: {high_db: [3.0, 7.0], low_db: [-3.0, 0.0]}
    bright: {high_db: [8.0, 12.0], low_db: [-5.0, -2.0]}
  mids:               # EQ3 peak (Q 0.9)
    scooped: {mid_db: [-10.0, -5.0], mid_hz: [400.0, 800.0]}
    neutral: {mid_db: [-1.5, 1.5], mid_hz: [600.0, 1200.0]}
    pushed: {mid_db: [4.0, 9.0], mid_hz: [700.0, 1200.0]}
  compression:        # compressor before the drive; inputs peak at -15 dBFS (R3 inference level)
    light: {threshold_db: [-30.0, -20.0], ratio: [2.0, 3.5], attack_ms: [10.0, 30.0], release_ms: [100.0, 250.0]}
    heavy: {threshold_db: [-45.0, -35.0], ratio: [8.0, 20.0], attack_ms: [1.0, 5.0], release_ms: [50.0, 150.0]}
  fixed:              # held constant (output level is irrelevant: renders are peak-normalized)
    drive: {bias: [0.0, 0.0], level_db: [-12.0, -12.0]}
    compressor: {makeup_db: [0.0, 0.0]}
pedals:               # KB knob rotations; level/volume knobs fixed at noon
  ts808:
    gain_knob: drive
    tone_knob: tone
    fixed: {level: 0.5}
    gain: {low: [0.0, 0.3], medium: [0.3, 0.6], high: [0.6, 0.85], extreme: [0.85, 1.0]}
    tone: {dark: [0.0, 0.15], slightly_dark: [0.15, 0.4], neutral: [0.4, 0.65], slightly_bright: [0.65, 0.85], bright: [0.85, 1.0]}
  ds1:
    gain_knob: dist
    tone_knob: tone
    fixed: {level: 0.5}
    gain: {low: [0.0, 0.1], medium: [0.1, 0.35], high: [0.35, 0.75], extreme: [0.75, 1.0]}
    tone: {dark: [0.0, 0.15], slightly_dark: [0.15, 0.4], neutral: [0.4, 0.6], slightly_bright: [0.6, 0.85], bright: [0.85, 1.0]}
  rat:                # holdout pedal (test_unseen_pedal); Filter is reversed: clockwise = darker
    gain_knob: distortion
    tone_knob: filter
    fixed: {volume: 0.5}
    gain: {low: [0.02, 0.1], medium: [0.1, 0.35], high: [0.35, 0.7], extreme: [0.7, 1.0]}   # steep A taper: 0 = 4.5 dB, 0.02 = 20 dB
    tone: {dark: [0.85, 1.0], slightly_dark: [0.6, 0.85], neutral: [0.35, 0.6], slightly_bright: [0.15, 0.35], bright: [0.0, 0.15]}
  big_muff:
    gain_knob: sustain
    tone_knob: tone
    fixed: {volume: 0.5}
    gain: {low: [0.0, 0.1], medium: [0.1, 0.3], high: [0.3, 0.7], extreme: [0.7, 1.0]}
    tone: {dark: [0.0, 0.15], slightly_dark: [0.15, 0.4], neutral: [0.4, 0.6], slightly_bright: [0.6, 0.85], bright: [0.85, 1.0]}
  fuzz_face_ge:       # no tone knob: brightness requests are not realized on this pedal
    gain_knob: fuzz
    fixed: {volume: 0.5}
    gain: {low: [0.0, 0.3], medium: [0.3, 0.6], high: [0.6, 0.85], extreme: [0.85, 1.0]}
  fuzz_face_si:
    gain_knob: fuzz
    fixed: {volume: 0.5}
    gain: {low: [0.0, 0.3], medium: [0.3, 0.6], high: [0.6, 0.85], extreme: [0.85, 1.0]}
