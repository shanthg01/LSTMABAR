# Shared defaults. Experiment configs list this under `defaults:` and override keys.
name: run
seed: 0

audio:
  sample_rate: 44100
  clip_seconds: 3.0

paths:
  data: data
  runs: runs
  pedals: pedals

physics:
  # Level calibration (P2 decision 3): 0 dBFS = this many volts peak at the pedal input.
  volts_per_full_scale: 1.0
