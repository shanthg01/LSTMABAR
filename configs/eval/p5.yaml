# P5 evaluation harness and baselines (docs/execution-plan.md, "P5 kickoff brief", D1-D11).
# Usage: lstmabar eval <step> [--config configs/eval/p5.yaml] [dotlist overrides]
defaults:
  - ../data/gold_v1.yaml

name: eval_p5

eval:
  seed: 0
  report_dir: reports                     # reports/p5_baselines.{md,json}
  report_name: p5_baselines
  splits: [test, test_unseen_pedal]       # synthetic splits reported (val only selects, D8)
  select_split: val                       # baseline/k selection (D8); never a gold split
  gold_manifest: ${data.manifests_dir}/${gold.version}.jsonl
  gold_index: ${data.manifests_dir}/${gold.version}.index.json
  max_items: null                         # cap per split for smoke runs (--limit overrides)
  methods: [noop, mean, knn_clap, knn_bge, llm_zero_shot, text2fx]
  workers: 2                              # 16 GB machine

  metrics:                                # D2
    gate_threshold: 0.5
    mrstft_fft_sizes: [512, 1024, 2048]   # dsp.losses.multi_resolution_stft_loss
    afc_distances: [mrstft, descriptor]   # primary, secondary
    harmonic_descriptors: true            # harmonic analysis of predicted renders (~90 % of
                                          # scoring time). false keeps the centroid; odd/even,
                                          # HNR and archetype terms become NaN; reports must
                                          # state it
    descriptor_keys: [centroid_hz, odd_even_db, hnr_db]   # source descriptor keys; the error
                                                          # terms are metrics.DESCRIPTOR_TERMS

  stats:                                  # D3
    n_resamples: 10000
    alpha: 0.05
    min_seeds: 5

  embeddings:                             # D5: data/cache/<family>/<model>/<split>_<kind>.npz
    dir: ${data.cache_dir}
    clap_models: [larger_clap_general, clap-htsat-unfused]
    text_models: [bge-base-en-v1.5]
    batch_size: 32
    clap_sample_rate: 48000

  baselines:                              # D4
    knn:
      k_grid: [1, 3, 5, 10, 25, 50]       # tuned on val (D8)
      clap_model: clap-htsat-unfused      # knn_clap text backbone (the other CLAP: ablation)
      bge_model: bge-base-en-v1.5         # knn_bge
    llm:
      model: claude-haiku-5-5
      max_usd: 1.0                        # hard cap (R1 ledger/guard pattern)
      prompt_version: z1
      price_per_mtok: {input: 0.05, output: 0.25}   # Batches API price (as captions)
    text2fx:
      clap_model: clap-htsat-unfused
      steps: 200
      lr: 0.05
      max_items: 60                       # local subset per split (full run on Colab)

  proxy:                                  # D8: synthetic val 2AFC
    version: valproxy_v1                  # audio: data/rendered/valproxy_v1/ (gitignored)
    distractors_per_item: 2
    selection_weights: {mrstft: 1.0, param_l1: 1.0, afc: 1.0}   # proxy.selection_score; wave 1
                                                                # (f) may rescale with a reason

  sim_real:                               # D11
    input_peak_sweep_dbfs: [-24.0, -18.0, -12.0, -6.0]
    resample_to: 44100
