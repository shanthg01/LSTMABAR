# Dataset v1 (P4). Resolutions R1-R10 in docs/execution-plan.md ("P4 kickoff brief").
# Usage: lstmabar data <step> --config configs/data/v1.yaml [dotlist overrides]
defaults:
  - ../base.yaml

name: data_v1

data:
  version: v1
  # Everything audio lives under gitignored dirs; only manifests/hashes/calibration are committed.
  sources_dir: data/sources        # raw downloads, extracted DI (gitignored)
  rendered_dir: data/rendered      # dry clips + wet shards (gitignored)
  cache_dir: data/cache            # f0 tracks, LLM cache + spend ledger (gitignored)
  test_real_dir: data/test_real    # real-pedal test audio (gitignored)
  manifests_dir: data/manifests    # committed manifests, index, hashes
  calibration_dir: data/calibration  # committed white-box calibration tables (R4)

ingest:
  # Guitar-TECHS DI is the only training DI (R2); EGFxSet is test-only (task 4.4).
  sources: [guitar_techs]
  pre_onset_ms: 20.0          # clip starts this long before a detected onset
  min_rms_dbfs: -45.0         # skip near-silent windows (dBFS RMS of the clip)
  dry_peak_dbfs: -1.0         # canonical stored dry level (R3)
  dry_subtype: PCM_16
  max_clips: null             # cap for smoke runs
  # Performer split (decision 11). Filled in by the ingest task from the dataset's naming.
  train_performers: []
  heldout_performer: null

render:
  shard_size: 1000
  workers: 4
  renders_per_clip: {train: 6, val: 4, test: 4}
  unseen_renders_per_clip: 2   # extra holdout-pedal renders per test clip (R6, R7)
  input_peak_dbfs: [-24.0, -6.0]  # U(lo, hi) per render (R3)
  wet_peak_dbfs: -1.0
  wet_subtype: PCM_24
  pedal_fraction: 0.7          # R5: pedal presets vs free board
  free_board_mix: {bypass: 0.05, eq: 0.25, comp: 0.15, comp_eq: 0.15, drive: 0.40}
  free_drive_p_eq: 0.5
  free_drive_p_comp: 0.5
  holdout_pedal: rat           # test_unseen_pedal (decision 11, R6)
  whitebox_pedals: [ts808, ds1]
  whitebox_oversample: 4

calibration:                   # R4
  gain_points: 5
  tone_points: 3
  sine_levels_dbfs: [-24.0, -15.0, -6.0]
  max_jump: 0.25               # max normalized-param jump between grid neighbours before
                               # falling back to the nearest grid point

analysis:
  n_harmonics: 10
  max_frames: 64
  min_voiced_fraction: 0.3     # below this, harmonic descriptors are NaN (decision 5)

captions:                      # R1
  model: claude-haiku-5-5
  prompt_version: p1
  per_request: 25
  paraphrases_per_item: 1
  templates_per_item: 1
  pedal_name_fraction: 0.25
  max_usd: 2.5
  pilot_items: 100
  price_per_mtok: {input: 0.05, output: 0.25}   # Batches API price for the model above

splits:
  seed: 0
  val_fraction: 0.5            # of held-out-performer recordings; the rest are test
